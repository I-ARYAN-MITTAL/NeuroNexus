<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom hover effect animation */
        .submit-btn-hover {
            transition: all 0.3s ease;
        }
        
        .submit-btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-50 rounded-lg shadow-[0_8px_30px_rgb(0,0,0,0.12)] p-8 max-w-2xl w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Contact Information Form</h1>
        
        <form class="space-y-6">
            <!-- Full Name -->
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">
                    Full Name *
                </label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your full name"
                >
            </div>

            <!-- Contact Number -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                    Contact Number *
                </label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your contact number"
                >
            </div>

            <!-- Address -->
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700 mb-1">
                    Address *
                </label>
                <textarea 
                    id="address" 
                    name="address" 
                    rows="3" 
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your address"
                ></textarea>
            </div>

            <!-- Company Name -->
            <div>
                <label for="company" class="block text-sm font-medium text-gray-700 mb-1">
                    Company Name *
                </label>
                <input 
                    type="text" 
                    id="company" 
                    name="company" 
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your company name"
                >
            </div>

            <!-- Email Address -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    Email Address *
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your email address"
                >
            </div>

            <!-- Department -->
            <div>
                <label for="department" class="block text-sm font-medium text-gray-700 mb-1">
                    Department *
                </label>
                <select 
                    id="department" 
                    name="department" 
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
                    <option value="" disabled selected>Select your department</option>
                    <option value="hr">HR</option>
                    <option value="sales">Sales</option>
                    <option value="development">Development</option>
                    <option value="marketing">Marketing</option>
                    <option value="others">Others</option>
                </select>
            </div>

            <!-- Gender -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Gender *
                </label>
                <div class="space-y-2">
                    <div class="flex items-center">
                        <input 
                            type="radio" 
                            id="male" 
                            name="gender" 
                            value="male" 
                            required
                            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300"
                        >
                        <label for="male" class="ml-2 text-sm text-gray-700">Male</label>
                    </div>
                    <div class="flex items-center">
                        <input 
                            type="radio" 
                            id="female" 
                            name="gender" 
                            value="female"
                            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300"
                        >
                        <label for="female" class="ml-2 text-sm text-gray-700">Female</label>
                    </div>
                    <div class="flex items-center">
                        <input 
                            type="radio" 
                            id="prefer-not-to-say" 
                            name="gender" 
                            value="prefer-not-to-say"
                            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300"
                        >
                        <label for="prefer-not-to-say" class="ml-2 text-sm text-gray-700">Prefer not to say</label>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button 
                    type="submit"
                    class="submit-btn-hover w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-200"
                >
                    Submit
                </button>
            </div>
        </form>
    </div>
</body>
</html>
